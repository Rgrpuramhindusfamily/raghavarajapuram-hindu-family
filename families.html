<script>

const grid = document.getElementById("familyGrid");


families.forEach(family => {

    const card = document.createElement("div");

    card.className = "family-card";

    card.innerHTML = `
        <a href="family.html?family=${family.id}">
            <h3>${family.name}</h3>
        </a>
    `;

    grid.appendChild(card);

});
